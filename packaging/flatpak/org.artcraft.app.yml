app-id: org.artcraft.app
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: wordcraft
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/wordcraft/cargo
modules:
  - name: wordcraft
    buildsystem: simple
    build-commands:
      - cargo build --release -p wordcraft
      - install -Dm755 target/release/wordcraft /app/bin/wordcraft
    sources:
      - type: dir
        path: ../../
