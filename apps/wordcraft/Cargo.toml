[package]
name = "wordcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "wordcraft"
description = "WordCraft desktop app"

[lints]
workspace = true

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-ui-martensite = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
# Icon + VERSIONINFO for wordcraft.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/wordcraft", dest = "/usr/bin/wordcraft", mode = "755" }
]
